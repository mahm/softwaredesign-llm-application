[env]
_.file = ".env"

[tools]
bun = "1.3.5"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.check]
description = "Run TypeScript typecheck"
run = "bun run check"

[tasks.tbench-smoke]
description = "Run the local Terminal-Bench smoke set"
run = "bun run tbench:smoke"
