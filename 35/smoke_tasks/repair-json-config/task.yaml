instruction: |
  Repair /app/service-config.json so it becomes valid JSON with exactly these values:

  - service: "demo-api"
  - enabled: true
  - retries: 3
  - endpoints.health: "/healthz"

  Keep the file at /app/service-config.json. After editing it, verify the JSON with a shell command.
